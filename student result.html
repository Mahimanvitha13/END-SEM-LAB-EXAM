
<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="loginPage">
        <h1>Student Result Management</h1>
        <h2>Admin Login</h2>

        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="login()">Login</button>
        <p id="loginMessage"></p>
    </div>

    <div class="dashboard" id="dashboard" style="display:none">

        <h1>Admin Dashboard</h1>

        <button onclick="logout()">Logout</button>

        <h2>Add Student Details</h2>

        <input type="text" id="roll" placeholder="Roll Number">
        <input type="text" id="name" placeholder="Student Name">

        <input type="number" id="m1" placeholder="HTML Marks">
        <input type="number" id="m2" placeholder="CSS Marks">
        <input type="number" id="m3" placeholder="JavaScript Marks">

        <button onclick="addStudent()">Add Student</button>

        <h2>Student Results</h2>

        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Grade</th>
                    <th>Result</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>
        </table>

        <h2>Check Student Result</h2>

        <input type="text" id="searchRoll"
               placeholder="Enter Roll Number">

        <button onclick="searchStudent()">Search</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
